name: CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CONFIGURATION: Release

jobs:
  check:
    name: 檢查（.NET 10，Windows）
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v5

      - name: 安裝 .NET SDK（版本依 global.json）
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: 還原套件
        run: dotnet restore

      - name: 1. Lint（分析器與程式碼樣式，警告視為錯誤）
        if: ${{ !cancelled() }}
        run: dotnet build -c "$CONFIGURATION" --no-restore

      - name: 2. Format
        if: ${{ !cancelled() }}
        run: dotnet format --verify-no-changes --no-restore

      - name: 3. Type Check（每個專案都開啟 Nullable）
        if: ${{ !cancelled() }}
        run: bash tools/check-type-settings.sh

      - name: 4. Unit Test
        if: ${{ !cancelled() }}
        run: dotnet test -c "$CONFIGURATION" --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: 5. Build Check（self-contained 單一檔案發行與 zip）
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/package.ps1 -Configuration $env:CONFIGURATION -PublishDirectory publish -OutputDirectory artifacts

      - name: 6. Git Diff Check
        if: ${{ !cancelled() }}
        run: bash tools/diff-check.sh

      - name: 7. Smoke Test（自我檢查＋實際取樣＋WPF 開啟／關閉）
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/smoke-test.ps1 -Exe publish/Cli/PerformanceMonitor.Cli.exe -App publish/App/PerformanceMonitor.exe

      - name: 8. 穩定性（Cli 連續監控 3 分鐘）
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/Test-Stability.ps1 -Target Cli -Cli publish/Cli/PerformanceMonitor.Cli.exe -DurationMinutes 3 -MeasureIntervalSeconds 10 -OutputDirectory TestResults/stability

      - name: 上傳穩定性報告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: stability-ci
          path: |
            TestResults/stability/*.md
            TestResults/stability/*.csv
            TestResults/stability/*.txt
            TestResults/stability/report.html
          if-no-files-found: warn

      - name: 上傳發行 zip（試用）
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: package
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
